<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Products | Modern Services and Trading
  </title>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="siteHeader">
  </div>
  <main class="products-area">
   <section class="pagehero">
    <div class="container">
     <p class="breadcrumbs">
      HOME / PRODUCTS
     </p>
     <h1>
      Products
     </h1>
     <p style="max-width:720px;color:#68736d">
      Premium food products sourced from trusted origins around the world for hotels, restaurants, catering, bakeries and professional kitchens.
     </p>
    </div>
   </section>
   <section class="product-layout container">
    <aside class="sidebar">
     <h3>
      Categories
     </h3>
     <div class="filter-list" id="filterList">
     </div>
    </aside>
    <section>
     <div class="products-head">
      <div>
       <p class="eyebrow">
        Modern Services and Trading PRODUCTS
       </p>
       <h2>
        Our Range
       </h2>
       <small id="resultCount" style="color:#7b867f">
       </small>
      </div>
      <div class="product-search">
       <i class="bi bi-search">
       </i>
       <input id="productSearch" placeholder="Search Products"/>
      </div>
     </div>
     <div class="product-grid" id="productGrid">
     </div>
     <div class="pagination" id="pagination">
     </div>
    </section>
   </section>
  </main>
  <div id="siteFooter">
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js">
  </script>
  <script src="js/data.js">
  </script>
  <script src="js/main.js">
  </script>
 </body>
</html>
