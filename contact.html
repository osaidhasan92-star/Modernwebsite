<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Contact Us | Modern Services and Trading
  </title>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="siteHeader">
  </div>
  <main>
   <section class="pagehero">
    <div class="container">
     <p class="breadcrumbs">
      HOME / CONTACT US
     </p>
     <h1>
      Contact Us
     </h1>
    </div>
   </section>
   <section class="contact-grid container">
    <div>
     <p class="eyebrow">
      GENERAL INQUIRIES
     </p>
     <h2 style="font:600 45px Georgia,serif">
      Let's work together.
     </h2>
     <div class="contact-item">
      <i class="bi bi-telephone">
      </i>
      <div>
       <strong>
        PHONE
       </strong>
       <p>
        +971 4 347 44 84
        <br/>
        +971 50 777 91 34
       </p>
      </div>
     </div>
     <div class="contact-item">
      <i class="bi bi-envelope">
      </i>
      <div>
       <strong>
        EMAIL
       </strong>
       <p>
        mktgt@eim.ae
        <br/>
        connect@mktgt.com
       </p>
      </div>
     </div>
     <div class="contact-item">
      <i class="bi bi-geo-alt">
      </i>
      <div>
       <strong>
        ADDRESS
       </strong>
       <p>
        Po Box 234174, Ras Al Khor Industrial Area 2, Dubai, UAE
       </p>
      </div>
     </div>
    </div>
    <div>
     <form class="form quote-form">
      <div class="form-grid">
       <input placeholder="Name" required=""/>
       <input placeholder="Mobile"/>
       <input placeholder="Email" required="" type="email"/>
       <input placeholder="Product Name"/>
       <textarea placeholder="Message"></textarea>
      </div>
      <button class="btn" type="submit">
       SEND
       <i class="bi bi-arrow-right">
       </i>
      </button>
      <div class="notice" style="display:none">
      </div>
     </form>
     <div class="mapbox" style="margin-top:28px">
      DUBAI · UAE
     </div>
    </div>
   </section>
  </main>
  <div id="siteFooter">
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js">
  </script>
  <script src="js/data.js">
  </script>
  <script src="js/main.js">
  </script>
 </body>
</html>
