<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title id="pageTitle">
   Product | Modern Services and Trading
  </title>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="siteHeader">
  </div>
  <main>
   <section class="pagehero">
    <div class="container">
     <p class="breadcrumbs">
      HOME / PRODUCTS / PRODUCT
     </p>
     <h1 id="pageTitle">
      Product
     </h1>
    </div>
   </section>
   <section class="detail-grid container">
    <div class="detail-art" id="detailImage">
     <i class="bi bi-box">
     </i>
    </div>
    <div>
     <p class="eyebrow" id="detailCat">
      PRODUCT
     </p>
     <h1 id="detailTitle">
      Product
     </h1>
     <p id="detailDesc" style="color:#68736d;font-size:14px">
     </p>
     <div class="meta">
      <div>
       Brand
      </div>
      <div id="metaBrand">
       Various
      </div>
      <div>
       Packing
      </div>
      <div id="metaPacking">
       —
      </div>
      <div>
       Origin
      </div>
      <div id="metaOrigin">
       —
      </div>
     </div>
     <a class="btn" href="#enquiry" style="margin-top:28px">
      SEND ENQUIRY
      <i class="bi bi-arrow-down">
      </i>
     </a>
    </div>
   </section>
   <section class="enquiry" id="enquiry">
    <div class="container" style="max-width:900px">
     <p class="eyebrow">
      PRODUCT ENQUIRY
     </p>
     <h2 style="font:600 45px Georgia,serif;margin-top:0">
      Request a quotation.
     </h2>
     <form class="form quote-form">
      <div class="form-grid">
       <input placeholder="Name" required=""/>
       <input placeholder="Email" required="" type="email"/>
       <input placeholder="Mobile" required=""/>
       <input id="quoteProduct" placeholder="Product Name"/>
       <textarea placeholder="Message"></textarea>
      </div>
      <button class="btn" type="submit">
       SEND
       <i class="bi bi-arrow-right">
       </i>
      </button>
      <div class="notice" style="display:none">
      </div>
     </form>
    </div>
   </section>
  </main>
  <div id="siteFooter">
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js">
  </script>
  <script src="js/data.js">
  </script>
  <script src="js/main.js">
  </script>
 </body>
</html>
